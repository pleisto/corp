en-US:
  meta:
    lang: en-US
    dir: ltr
    noscript: We're sorry but Brickdoc doesn't work properly without JavaScript enabled. Please visit %{url} for more information.
    noscript_url: https://www.wikihow.com/Enable-JavaScript
  unsupported_browser:
    title: 'Upgrade your browser'
    download_latest_browser_html: Unfortunately, Brickdoc has updated features that can't run on this version of your browser.
  status:
    forbidden: 403 Forbidden
    invalid_csrf_token: The session is expired, please try again.
  errors:
    messages:
      already_confirmed: was already confirmed, please try signing in
      confirmation_period_expired: needs to be confirmed within %{period}, please request a new one
      expired: has expired, please request a new one
      not_found: not found
      not_locked: was not locked
      not_saved:
        one: '1 error prohibited this %{resource} from being saved:'
        other: '%{count} errors prohibited this %{resource} from being saved:'
      is_not_valid_domain: 'Space domain "%{domain}" is not available'
      is_not_valid_email: 'Email "%{email}" is not available'
      send_interval: Sending interval is too short, please try again after 1 minute
      accepted: must be accepted
      model_invalid: 'Validation failed: %{errors}'
      email_invalid: is not an email
      domain_invalid: is not a valid domain name
      uuid_invalid: is not an uuid
      domain_presence_invalid: is not presence
      not_a_number: is not a number
      not_an_integer: must be an integer
      taken: has already been taken
      InvalidImageUrl: Invalid image url
  users:
    auth_providers:
      password:
        name: Password
        username: Username
        password: Password
        sign_in: Sign In
        sign_up: Sign up with password
      magic_link:
        name: Magic Link
        email_placeholder: Enter your email address
        sign_in_or_sign_up: Continue with magic link
    sign_in:
      title: Sign in
      heading: Sign in to Brickdoc
      more_login_options: More Login Options
      sign_up_disabled: |
        We couldn't find your account, and currently sign up is disabled.
        Please contact site administrator for more information.
      unknown_failed: Unknown error occurred. Please try again.
    sign_up:
      title: Sign up
      disabled: |
        Sign up is currently disabled for this site, please contact site administrator for more information.
        If you already have an account, click logo to sign in.
    sign_out:
      success: Signed out successfully.
