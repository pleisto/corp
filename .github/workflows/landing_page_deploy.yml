name: Deploy Landing Page
on:
  push:
    branches:
      - main
env:
  IMAGE_TAG: ghcr.io/pleisto/mashcard-landing-page:${{ github.run_id }}
  DOMAIN: mashcard.io
  GCP_PROJECT: golden-union-341912
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          file: apps/mashcard-landing-page/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy to GKE
    environment:
      name: landing_page
      url: https://${{ env.DOMAIN }}/
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v3
      - name: GCP Login
        uses: google-github-actions/auth@v0
        with:
          workload_identity_provider: 'projects/909250635156/locations/global/workloadIdentityPools/cicd/providers/github-action'
          service_account: 'cicd-bot@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com'
      - name: 'Get the GKE cluster Configuration'
        uses: 'google-github-actions/get-gke-credentials@v0'
        with:
          cluster_name: 'kube-us-central'
          location: 'us-central1'
      - name: 'Deploy to GKE'
        run: |-
          helm upgrade mashcard-landing-page ${{ github.workspace }}/tools/helm-charts/mashcard-landing-page \
           --install --atomic --timeout 5m --cleanup-on-fail --wait --namespace=saas \
            --set-string image.name='${{ env.IMAGE_TAG }}' \
            --set-string ingress.host='${{ env.DOMAIN }}' \
            --set serviceAccount.create=false
