name: Upgrade Deps

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # At 4:00 on every day-of-week from Monday through Friday (UTC)
    - cron: '0 4 * * 1-5'

env:
  NODE_OPTIONS: '--max-old-space-size=5950'
  YARN_ENABLE_IMMUTABLE_INSTALLS: false

jobs:
  dependency_updater:
    name: Check and Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: yarn
      - name: Update yarn packages
        run: eval "yarn up $PATTERNS --mode=update-lockfile && yarn up $PATTERNS --recursive --mode=update-lockfile"
        env:
          # Please keep patterns in sync with ./foss/.github/workflows/upgrade_deps.yml
          PATTERNS: "'*' '@*/*'"
      - name: Upgrade git submodules
        run: git submodule deinit --all --force && git submodule update --init --recursive --remote
      - name: Update yarn.lock
        run: yarn install
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.PAT_FOR_BOT_CREATED_PR }}
          title: 'chore(deps): upgrade dependencies'
          body: This is an [auto-created](https://github.com/pleisto/corp/blob/main/.github/workflows/upgrade_deps.yml) PR to upgrade dependencies.
          commit-message: 'chore(deps): upgrade dependencies'
          branch: deps-automatic-upgrade
          labels: |
            dependencies
          delete-branch: true
