name: Create Monolith Application Pull Request Preview Env

on:
  pull_request:
    types: [opend, synchronize]
    paths-ignore:
      - .github/**
      - '!.github/workflow/monolith_ci.yml'
      - .husky/**
      - bin/**
      - packages/brickdoc-design-system/**
      - '!packages/brickdoc-design-system/components/**'
      - packages/less-vars-loader/**
      - packages/rubocop-brickdoc/**
      - packages/eslint-plugin-brickdoc/**
      - public/**
      - templates/**
      - '!templates/helm-charts/**'
      - '**/*.template'
      - '**/*.md'
      - '**/Dockerfile'
      - '**/.git*'
      - '**/crowdin.yml'
      - '**/LICENSE'
      - '**/NOTICE'
      - '**/VERSION'
jobs:
  cancel:
    # Cancel any previous CI runs to save GH Actions minutes
    name: 'Cancel Previous Runs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@0.9.0
        with:
          access_token: ${{ github.token }}
  build:
    name: 'Build and Push Docker Image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: brickdocCE-${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            brickdocCE-${{ runner.os }}-buildx-
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: ghcr.io/brickdoc/brickdoc:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
  deploy:
    name: 'Deployment to BAE'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v2
      - name: Deployment to App Engine
        uses: brickdoc/app-engine@v1.beta2
        with:
          name: brickdoc-preview-pr${{ github.event.pull_request.number }}
          image: ghcr.io/brickdoc/brickdoc:${{ github.sha }}
          host: pr-${{ github.event.pull_request.number }}.brickdoc.dev
          chart: ${{ github.workspace }}/templates/helm-charts/brickdoc
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_GLOBAL_CORP_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_GLOBAL_CORP_SECRET }}
          # perview env is transient environment, so we use a fixed value here.
          # In a production environment, these values should be secret
          APP_ENV_SECURITY_REVERSIBLE_INT_PRIME: 1828824083
          APP_ENV_SECURITY_REVERSIBLE_INT_RANDOM: 1480013428
          APP_ENV_SECURITY_REVERSIBLE_INT_INVERSE: 536856091
          APP_SECRET_SECRET_KEY_BASE: ${{ secrets.previewEnvSecretKey }}
