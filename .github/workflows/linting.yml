name: Linting Code

on:
  pull_request:
  push:
    branches:
      - master
      - main
jobs:
  linting:
    name: Linting Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v2
        with:
          fetch-depth: 2 # To retrieve the preceding commit.
      - name: Get changed ruby files
        id: changed-ruby-files
        uses: tj-actions/changed-files@v8.9
        with:
          files: |
            .(rb)$
      - name: Get changed es files
        id: changed-es-files
        uses: tj-actions/changed-files@v8.9
        with:
          files: |
            .(ts|tsx|jsx)$
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        if: steps.changed-ruby-files.outputs.any_changed == 'true'
        with:
          ruby-version: 3.0
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Setup NodeJS
        if: steps.changed-es-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v2
        with:
          node-version: 16
          cache: yarn
      - name: Run yarn install
        if: steps.changed-es-files.outputs.any_changed == 'true'
        run: yarn
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
      - name: TS Check
        if: steps.changed-es-files.outputs.any_changed == 'true' && always()
        run: yarn tsc:check
      - name: ESLint
        if: steps.changed-es-files.outputs.any_changed == 'true' && always()
        run: yarn lint:eslint
      - name: Rubocop
        if: steps.changed-ruby-files.outputs.any_changed == 'true' && always()
        run: |
          echo "::add-matcher::.github/matchers/rubocop.json"
          yarn lint:rubocop
      - name: Brakeman
        if: steps.changed-ruby-files.outputs.any_changed == 'true' && always()
        run: |
          echo "::add-matcher::.github/matchers/brakeman.json"
          yarn lint:brakeman -f csv -o /dev/stdout

