name: Linting Code
concurrency:
  group: monolith-linting-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches:
      - master
      - main
env:
  YARN_CHECKSUM_BEHAVIOR: update
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: brickdoc
jobs:
  es:
    name: ECMAScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub-hosted runner have 7 gb RAM.
      # 5250mb === 7gb * 0.75
      NODE_OPTIONS: '--max-old-space-size=5950'
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v3
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: yarn
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Run yarn install
        run: yarn install --immutable
      - name: Run yarn lint
        run: yarn lint
  ruby:
    name: Ruby
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v2
        with:
          fetch-depth: 2 # To retrieve the preceding commit.
      - name: Get changed ruby files
        id: changed-ruby-files
        uses: tj-actions/changed-files@v14.1
        with:
          files: |
            .(rb)$
            Gemfile.lock
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libsodium23 rustc
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        if: steps.changed-ruby-files.outputs.any_changed == 'true'
        with:
          ruby-version: 3.0.2
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run Rubocop
        if: steps.changed-ruby-files.outputs.any_changed == 'true'
        run: |
          echo "::add-matcher::.github/matchers/rubocop.json"
          bundle exec rubocop --parallel --config .rubocop.yml
      - name: Run Brakeman
        if: steps.changed-ruby-files.outputs.any_changed == 'true'
        run: |
          echo "::add-matcher::.github/matchers/brakeman.json"
          bundle exec brakeman --no-pager -f csv -o /dev/stdout
      - name: Run Sorbet Static Type Checker
        if: steps.changed-ruby-files.outputs.any_changed == 'true'
        run: |
          bundle exec srb tc
