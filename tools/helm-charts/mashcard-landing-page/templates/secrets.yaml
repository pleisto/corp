{{- if empty .Values.secrets  }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mashcard-landing-page.fullname" . }}
  labels: {{- include "mashcard-landing-page.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
