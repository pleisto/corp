default: &default
  secret_key_base: <%= Brickdoc::Crypto.derive_key :rails_master_key %>
development:
  <<: *default
test:
  <<: *default
# Ensure that you don't lose it.
# If you change or lose this key you will be unable to access variables stored in database.
# Make sure the secret is at least 30 characters and all random,
# no regular words or you'll be exposed to dictionary attacks.
# Do not keep production secrets in the repository, instead read values from the environment.
production:
  <<: *default
